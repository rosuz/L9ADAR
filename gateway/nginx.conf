# Sets $connection_upgrade for WebSocket requests (explained below the file).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Named targets. Docker's DNS resolves the service names.
upstream backend_api {
  server backend:3000;
}

upstream frontend_app {
  server frontend:8080;
}

# Port 8080 inside the container = port 80 on your computer. Redirect to HTTPS.
server {
  listen 8080;
  server_name _;
  return 301 https://$host$request_uri;
}

# Port 8443 inside the container = port 443 on your computer. The real site.
server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/selfsigned.crt;
  ssl_certificate_key /etc/nginx/certs/selfsigned.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  server_tokens off;
  client_max_body_size 6m;   # keep at or above UPLOAD_MAX_MB

  include /etc/nginx/snippets/security-headers.conf;

  # Container health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # REST API.
  location /api/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket (Socket.IO). Same headers, plus the upgrade pair and long timeouts.
  location /socket.io/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Uploaded photos, read straight from the media volume (read-only).
  location /media/ {
    alias /srv/media/;
    include /etc/nginx/snippets/security-headers.conf;
    expires 7d;
    try_files $uri =404;
  }

  # Everything else: the React app.
  location / {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
